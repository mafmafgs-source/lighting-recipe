<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Lighting Recipe - My Page</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LR">
<meta name="theme-color" content="#0f0f0f">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#0f0f0f;color:#e8e8e8;-webkit-text-size-adjust:100%}
.wrap{max-width:430px;margin:auto;padding:10px}

/* ヘッダー */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:4px 0}
.page-title{font-size:20px;font-weight:800;color:#e8e8e8;letter-spacing:.02em}
.btn-new{padding:8px 16px;border:none;border-radius:10px;background:#c8a96e;color:#0f0f0f;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-new:active{background:#b8956a}
.btn-gear{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid #2e2e2e;border-radius:10px;background:#1a1a1a;color:#e8e8e8;font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-gear:active{background:#252525}

/* 設定パネル */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:800;align-items:flex-start;justify-content:flex-end;padding:56px 12px 0}
.settings-overlay.open{display:flex}
.settings-panel{background:#181818;border:1px solid #333;border-radius:14px;padding:16px 18px;width:100%;max-width:300px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.settings-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:#c8a96e;letter-spacing:.04em;margin-bottom:16px}
.settings-close{background:none;border:none;color:#888;font-size:16px;cursor:pointer;padding:4px;-webkit-tap-highlight-color:transparent}
.settings-close:active{color:#e8e8e8}

/* 検索・並べ替え */
.list-controls{display:flex;gap:8px;margin-bottom:14px}
.search-input{flex:1;min-width:0;padding:9px 12px;border:1px solid #2e2e2e;border-radius:10px;background:#1a1a1a;color:#e8e8e8;font-size:13px;outline:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent}
.search-input::placeholder{color:#666}
.search-input:focus{border-color:#c8a96e}
.sort-toggle{flex-shrink:0;padding:9px 12px;border:1px solid #2e2e2e;border-radius:10px;background:#1a1a1a;color:#c8a96e;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.sort-toggle:active{background:#252525}

/* レシピカード */
.recipe-list{display:flex;flex-direction:column;gap:10px}
.recipe-card{display:flex;gap:12px;background:#1a1a1a;border:1px solid #2e2e2e;border-radius:12px;padding:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.recipe-card:active{background:#222}
.recipe-thumb{width:72px;height:72px;border-radius:8px;background:#111;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.recipe-thumb img{width:100%;height:100%;object-fit:cover}
.recipe-thumb-empty{font-size:28px;opacity:.3}
.recipe-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.recipe-title{font-size:14px;font-weight:700;color:#e8e8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-meta{font-size:11px;color:#888;display:flex;gap:8px;flex-wrap:wrap}
.recipe-meta span{white-space:nowrap}
.recipe-items{font-size:10px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recipe-actions{display:flex;align-items:center;flex-shrink:0}
.btn-del{background:none;border:none;font-size:18px;color:#444;cursor:pointer;padding:8px}
.btn-del:active{color:#c0392b}

/* 空状態 */
.empty-state{text-align:center;padding:60px 20px;color:#555}
.empty-state .empty-icon{font-size:48px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:14px;line-height:1.7;margin-bottom:20px}

/* タブバー */
.tab-bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111;border-top:1px solid #2e2e2e;z-index:500;max-width:100%}
.tab-bar a{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 22px);text-decoration:none;font-size:13px;font-weight:600;color:#666;-webkit-tap-highlight-color:transparent;transition:color .15s}
.tab-bar a.active{color:#c8a96e}
.tab-spacer{height:82px}

/* 保存上限バナー */
.storage-notice{background:#1a1a0a;border:1px solid #3a3010;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.storage-notice-text{flex:1;font-size:11px;color:#888;line-height:1.6}
.storage-notice-text b{color:#c8a96e;font-size:12px}
.storage-bar-wrap{height:4px;background:#2a2a2a;border-radius:2px;margin-top:5px;overflow:hidden}
.storage-bar{height:100%;border-radius:2px;background:#c8a96e;transition:width .4s}
.storage-bar.full{background:#c0392b}

/* 上限超えダイアログ */
.limit-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:700;align-items:center;justify-content:center;padding:20px}
.limit-overlay.open{display:flex}
.limit-dlg{background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:24px;max-width:320px;width:100%}
.limit-dlg h3{font-size:16px;font-weight:800;color:#e8e8e8;margin-bottom:8px}
.limit-dlg p{font-size:13px;color:#888;line-height:1.7;margin-bottom:20px}
.limit-btns{display:flex;flex-direction:column;gap:8px}
.btn-limit-delete{padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#252525;border:1px solid #444;color:#e8e8e8;text-align:center}
.btn-limit-sub{padding:13px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;background:#c8a96e;border:none;color:#0f0f0f;text-align:center}
.btn-limit-cancel{padding:11px;border-radius:10px;font-size:13px;cursor:pointer;background:transparent;border:1px solid #2a2a2a;color:#666;text-align:center}
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;align-items:center;justify-content:center;padding:20px}
.confirm-overlay.open{display:flex}
.confirm-dlg{background:#1e1e1e;border:1px solid #333;border-radius:16px;padding:24px;text-align:center;max-width:300px;width:100%}
.confirm-dlg p{font-size:14px;color:#e8e8e8;margin-bottom:20px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn-confirm-cancel{background:#252525;border:1px solid #333;color:#aaa}
.btn-confirm-del{background:#c0392b;border:none;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <span class="page-title">MY RECIPES</span>
    <button class="btn-gear" id="btnGear" onclick="toggleSettings()" aria-label="Settings">⚙️</button>
  </div>
  <!-- 保存上限バナー -->
  <div class="storage-notice" id="storageNotice">
    <div class="storage-notice-text">
      <b data-i18n="limitBanner1">⚠️ 保存上限：30件</b><span data-i18n="limitBanner2">（ゲスト・無料ユーザー）</span><br>
      <span data-i18n="limitBanner3">サブスクリプションで無制限に保存できます。</span>
      <div class="storage-bar-wrap">
        <div class="storage-bar" id="storageBar" style="width:0%"></div>
      </div>
    </div>
    <span id="storageCount" style="font-size:13px;font-weight:700;color:#c8a96e;flex-shrink:0">0/30</span>
  </div>
  <!-- 検索・並べ替え -->
  <div class="list-controls" id="listControls" style="display:none">
    <input type="search" id="searchInput" class="search-input" data-i18n-ph="searchPlaceholder" placeholder="🔍 タイトル・場所・日付で検索" oninput="applyFilterSort()" autocomplete="off">
    <button class="sort-toggle" id="sortToggle" onclick="toggleSortDir()"></button>
  </div>
  <div class="recipe-list" id="recipeList"></div>
</div>

<!-- 設定パネル（歯車から開閉） -->
<div class="settings-overlay" id="settingsOverlay" onclick="if(event.target===this)toggleSettings()">
  <div class="settings-panel">
    <div class="settings-head">
      <span data-i18n="settingsTitle">⚙️ 設定</span>
      <button class="settings-close" onclick="toggleSettings()" aria-label="Close">✕</button>
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <label style="min-width:72px;font-size:13px;color:#aaa" data-i18n="langLabel">言語</label>
      <span id="lrLangMount"></span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <label style="min-width:72px;font-size:13px;color:#aaa" data-i18n="currencyLabel">通貨</label>
      <span id="lrCurMount"></span>
    </div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid #2e2e2e">
      <a href="privacy.html" style="font-size:13px;color:#c8a96e;text-decoration:none;display:inline-flex;align-items:center;gap:6px">🔒 <span data-i18n="privacyPolicy">プライバシーポリシー</span></a>
    </div>
  </div>
</div>

<!-- 上限超えダイアログ -->
<div class="limit-overlay" id="limitOverlay">
  <div class="limit-dlg">
    <h3 data-i18n="limitTitle">📦 保存上限に達しています</h3>
    <p data-i18n="limitBodyMypage">ゲスト・無料ユーザーは最大30件まで保存できます。新しいレシピを保存するには、古いレシピを削除するか、サブスクリプションにアップグレードしてください。</p>
    <div class="limit-btns">
      <button class="btn-limit-delete" onclick="closeLimitDialog();scrollToList()" data-i18n="limitDeleteOld">🗑 古いレシピを削除する</button>
      <button class="btn-limit-sub" onclick="closeLimitDialog();showSubscribeInfo()" data-i18n="limitSub">✨ サブスクで無制限に保存</button>
      <button class="btn-limit-cancel" onclick="closeLimitDialog()" data-i18n="cancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- 削除確認 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dlg">
    <p id="confirmMsg" data-i18n="confirmDeleteThis">このレシピを削除しますか？</p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()" data-i18n="cancel">キャンセル</button>
      <button class="btn-confirm-del" id="btnConfirmDel" data-i18n="del">削除</button>
    </div>
  </div>
</div>

<!-- タブバー -->
<div class="tab-spacer"></div>
<nav class="tab-bar">
  <a href="index.html" data-i18n="navRecipe">レシピ</a>
  <a href="builder.html" data-i18n="navGear">機材倉庫</a>
  <a href="mypage.html" class="active" data-i18n="navMypage">マイページ</a>
</nav>

<script src='i18n.js'></script>
<script>
// ══════════════════════════════════════
//  IndexedDB：レシピ保存用
// ══════════════════════════════════════
const DB_NAME='lr_recipes_db';
const DB_VER=1;
const STORE='recipes';

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const store=db.createObjectStore(STORE,{keyPath:'id'});
        store.createIndex('updatedAt','updatedAt',{unique:false});
      }
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}

async function getAllRecipes(){
  const db=await openDB();
  const result=await new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const store=tx.objectStore(STORE);
    const req=store.index('updatedAt').getAll();
    req.onsuccess=()=>resolve(req.result.reverse());
    req.onerror=e=>reject(e.target.error);
  });
  db.close();
  return result;
}

async function deleteRecipe(id){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=resolve;
    tx.onerror=e=>reject(e.target.error);
  });
}

const MAX_RECIPES=30;

// ── 保存上限バナー更新 ──
function updateStorageBar(count){
  const bar=document.getElementById('storageBar');
  const cnt=document.getElementById('storageCount');
  const pct=Math.min(100,Math.round(count/MAX_RECIPES*100));
  if(bar){ bar.style.width=pct+'%'; bar.classList.toggle('full',count>=MAX_RECIPES); }
  if(cnt){ cnt.textContent=`${count}/${MAX_RECIPES}`; cnt.style.color=count>=MAX_RECIPES?'#c0392b':'#c8a96e'; }
}

// ── 上限ダイアログ ──
function closeLimitDialog(){ document.getElementById('limitOverlay').classList.remove('open'); }
function scrollToList(){ document.getElementById('recipeList').scrollIntoView({behavior:'smooth'}); }
function showSubscribeInfo(){
  alert(T.subInfo);
}

// ── 上限チェック（index.htmlの保存前に呼ぶ用・mypageからは参照不要） ──
// ※ index.html 側で checkRecipeLimit() を呼び出して判定する

// ══════════════════════════════════════
//  レシピ一覧描画
// ══════════════════════════════════════
// 全レシピをキャッシュし、検索語＋並べ替えを適用して描画する
let allRecipes=[];
let sortDesc=true; // true=撮影日 新しい順（既定）／false=古い順

async function renderList(){
  const list=document.getElementById('recipeList');
  try{ allRecipes=await getAllRecipes(); }catch(e){ console.error(e); allRecipes=[]; }

  // バナー更新
  updateStorageBar(allRecipes.length);

  // 検索・並べ替えUIは、レシピが1件以上あるときだけ表示
  const controls=document.getElementById('listControls');
  if(controls) controls.style.display=allRecipes.length?'flex':'none';

  if(!allRecipes.length){
    list.innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">📷</div>
        <p>${T.noRecipesTitle}<br>${T.noRecipesHint}</p>
        <button class="btn-new" onclick="newRecipe()">${T.newRecipeCreate}</button>
      </div>`;
    return;
  }

  updateSortToggleLabel();
  applyFilterSort();
}

// 撮影日（無ければ更新日）を YYYYMMDD の数値にして並べ替えキーにする。
// exDateは 'YYYY/MM/DD'、updatedAtは 'YYYY-MM-DD...' と区切りが違うので数字だけ抽出して統一する。
function recipeSortKey(r){
  const raw=(r.session&&r.session.exDate)||(r.updatedAt?r.updatedAt.split('T')[0]:'')||'';
  const digits=raw.replace(/\D/g,'').slice(0,8);
  return digits?Number(digits.padEnd(8,'0')):0;
}

// 検索対象：タイトル・ロケ地・日付（撮影日/更新日、年・月で引けるよう複数表記を含める）
function recipeHaystack(r){
  const title=r.title||'';
  const loc=(r.session&&r.session.loc)||'';
  const exDate=(r.session&&r.session.exDate)||'';
  const upDate=r.updatedAt?r.updatedAt.split('T')[0]:'';
  return `${title} ${loc} ${exDate} ${exDate.replace(/\D/g,'')} ${upDate}`.toLowerCase();
}

function applyFilterSort(){
  const list=document.getElementById('recipeList');
  const q=(document.getElementById('searchInput')?.value||'').trim().toLowerCase();
  let rows=allRecipes.slice();
  if(q) rows=rows.filter(r=>recipeHaystack(r).includes(q));
  rows.sort((a,b)=>{ const ka=recipeSortKey(a),kb=recipeSortKey(b); return sortDesc?kb-ka:ka-kb; });

  if(!rows.length){
    list.innerHTML=`
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>${T.noSearchResults}</p>
      </div>`;
    return;
  }
  list.innerHTML=rows.map(recipeCardHTML).join('');
}

function recipeCardHTML(r){
  const date=r.session?.exDate||r.updatedAt?.split('T')[0]||'';
  const loc=r.session?.loc||'';
  const title=r.title||T.untitled;
  const itemCount=(r.lights||[]).filter(l=>l.items&&l.items.length).length;
  const items=(r.lights||[]).flatMap(l=>l.items||[]).slice(0,3).join(', ');
  const thumbSrc=r.photoData||'';
  // IDとタイトルはdata属性で渡す（onclick文字列埋め込みを避ける）
  const safeId=encodeURIComponent(r.id);

  return `
    <div class="recipe-card" data-id="${safeId}" onclick="handleCardClick(this)">
      <div class="recipe-thumb">
        ${thumbSrc?`<img src="${thumbSrc}">`:'<span class="recipe-thumb-empty">📷</span>'}
      </div>
      <div class="recipe-info">
        <div class="recipe-title">${title.replace(/</g,'&lt;')}</div>
        <div class="recipe-meta">
          ${date?`<span>📅 ${date}</span>`:''}
          ${loc?`<span>📍 ${loc.replace(/</g,'&lt;')}</span>`:''}
          <span>💡 ${T.lightsCountWrap(itemCount)}</span>
        </div>
        <div class="recipe-items">${(items||T.noGearShort).replace(/</g,'&lt;')}</div>
      </div>
      <div class="recipe-actions">
        <button class="btn-del" data-id="${safeId}" onclick="event.stopPropagation();handleDelClick(this)">🗑</button>
      </div>
    </div>`;
}

// 並べ替え方向の切替（撮影日 新しい順 ⇄ 古い順）
function toggleSortDir(){
  sortDesc=!sortDesc;
  updateSortToggleLabel();
  applyFilterSort();
}
function updateSortToggleLabel(){
  const btn=document.getElementById('sortToggle');
  if(btn) btn.textContent=sortDesc?T.sortNewest:T.sortOldest;
}

// ══════════════════════════════════════
//  アクション
// ══════════════════════════════════════
function newRecipe(){
  // 現在のセッションをクリアして新規作成→レシピ画面へ
  localStorage.removeItem('lr_session');
  localStorage.removeItem('lightingRecipeLights'); // 正しいキー
  localStorage.removeItem('lr_direct_items');
  localStorage.removeItem('lr_current_recipe_id');
  localStorage.removeItem('lr_recipe_title');
  window.location.href='index.html';
}

function loadRecipe(id){
  localStorage.setItem('lr_current_recipe_id',id);
  window.location.href='index.html?recipe='+id;
}

function handleCardClick(el){
  const id=decodeURIComponent(el.dataset.id);
  loadRecipe(id);
}
function handleDelClick(btn){
  const id=decodeURIComponent(btn.dataset.id);
  const card=btn.closest('.recipe-card');
  const title=card?.querySelector('.recipe-title')?.textContent||T.thisRecipe;
  confirmDelete(id,title);
}

// 削除確認
let deleteTargetId=null;
function confirmDelete(id,title){
  deleteTargetId=id;
  document.getElementById('confirmMsg').textContent=T.confirmDeleteWrap(title);
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm(){
  document.getElementById('confirmOverlay').classList.remove('open');
  deleteTargetId=null;
}
document.getElementById('btnConfirmDel').addEventListener('click',async()=>{
  if(deleteTargetId){
    await deleteRecipe(deleteTargetId);
    // 現在編集中のレシピが削除された場合
    if(localStorage.getItem('lr_current_recipe_id')===deleteTargetId){
      localStorage.removeItem('lr_current_recipe_id');
    }
    closeConfirm();
    renderList();
  }
});

// ══════════════════════════════════════
//  設定パネル（歯車で開閉）
// ══════════════════════════════════════
function toggleSettings(){
  document.getElementById('settingsOverlay').classList.toggle('open');
}

// 初期化
renderList();
</script>
</body>
</html>
